name: release

on:
  # A release for every push to main that changes the plugin - not for docs alone
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE', '.gitignore', 'docs/**' ]
  pull_request:
  workflow_dispatch:

# Pushes and manual runs share one group, so two of them can never read the same "latest release"
# and both try to create the same tag. PRs get a group of their own - a PR run queued in the release
# group would cancel a pending release run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

env:
  # CounterStrikeSharp loads plugins/<name>/<name>.dll, so the folder name must match the AssemblyName.
  PLUGIN: RetakesAllocator
  PROJECT: RetakesAllocator/RetakesAllocator.csproj
  OUTPUT: RetakesAllocator/bin/Release/net10.0

jobs:
  build:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN defaults to read-only on repos created since 2023, so creating a release fails
    # with 403 unless this is granted explicitly.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # PanoramaManager and RetakesPluginShared come from nuget.org by version.
      - name: Build
        run: dotnet build "$PROJECT" -c Release --nologo

      # The plugin folder exactly as ~/Projects/HudMenu/package.sh ships it: the whole build output
      # (CopyLocalLockFileAssemblies is on - EF Core, the sqlite natives under runtimes/ and the rest
      # all load from here), minus CounterStrikeSharp.API, which belongs to the host, and pdbs. The
      # panorama files go next to it for the workshop addon.
      - name: Stage release layout
        run: |
          set -e
          mkdir -p "out/$PLUGIN" out/workshop/panorama/layout/custom_game out/workshop/panorama/styles/custom_game
          cp -R "$OUTPUT/." "out/$PLUGIN/"
          find out -name '*.pdb' -delete
          find out -name 'CounterStrikeSharp.API.dll' -delete
          cp hud/panorama/layout/custom_game/*.xml out/workshop/panorama/layout/custom_game/
          cp hud/panorama/styles/custom_game/*.css out/workshop/panorama/styles/custom_game/

      - name: Verify the layout
        run: |
          set -e
          test -f "out/$PLUGIN/$PLUGIN.dll"
          test -f "out/$PLUGIN/$PLUGIN.deps.json"
          test -f "out/$PLUGIN/RetakesAllocatorCore.dll"
          test -f "out/$PLUGIN/PanoramaManager.dll"
          test -f "out/$PLUGIN/RetakesPluginShared.dll"
          test -d "out/$PLUGIN/runtimes/linux-x64"
          test -f "out/$PLUGIN/lang/en.json"
          find out -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}
          path: out/

      # Everything below only on main (push or manual run). PRs build and stop.
      - name: Work out the next version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # Highest v<N> across releases and tags, compared as numbers (v10 beats v9). Other tags are
          # ignored. run_number is not used because it counts PR runs too.
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          tags=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||')
          highest=$(printf '%s\n%s\n' "$releases" "$tags" | { grep -E '^v[0-9]+$' || true; } | sed 's/^v//' | sort -n | tail -1)
          next=$(( ${highest:-0} + 1 ))

          previous=${highest:+v$highest}
          echo "previous: ${previous:-none}  next: v${next}"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cd out && zip -qr "../$PLUGIN-${{ steps.version.outputs.tag }}.zip" . -x '*.DS_Store'

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "$PLUGIN-${{ steps.version.outputs.tag }}.zip" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
